<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Gestión de Becas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-md);
            width: 90%;
            max-width: 500px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
    </style>
</head>

<body class="dashboard-layout">

    <nav class="navbar">
        <div class="container nav-content">
            <a href="#" class="nav-logo">MiPortal</a>
            <div class="nav-links">
                <span>Postulante</span>
                <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <!-- Available Scholarships -->
        <h2 style="margin-bottom: 1.5rem;">Becas Disponibles</h2>
        <div id="scholarships-grid" class="grid-container" style="margin-bottom: 3rem;">
            <!-- Dynamic Cards -->
        </div>

        <!-- History -->
        <h2 style="margin-bottom: 1.5rem;">Mis Postulaciones</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Beca</th>
                        <th>Fecha Postulación</th>
                        <th>Estado</th>
                        <th>Notas del Evaluador</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <!-- Dynamic Content -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Application Modal -->
    <div id="app-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 600px;">
            <h2 id="modal-title" style="margin-bottom: 1rem;">Postular</h2>
            <form id="applicationForm">
                <input type="hidden" id="app-s-id">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="app-name" required placeholder="Su nombre completo">
                    </div>
                    <div class="form-group">
                        <label>Teléfono de Contacto</label>
                        <input type="tel" id="app-phone" required placeholder="Número de teléfono">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label>Tipo de Beca</label>
                        <input type="text" id="app-s-type" disabled style="background: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label>Promedio Académico (0-100)</label>
                        <input type="number" id="app-gpa" min="0" max="100" step="0.1" required placeholder="Min. 80">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label>Monto Solicitado</label>
                        <input type="number" id="app-amount" required placeholder="$0.00">
                    </div>
                    <div class="form-group">
                        <label
                            style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-top: 1.5rem;">
                            <input type="checkbox" id="app-is-minor" style="width: auto;">
                            ¿Eres menor de edad?
                        </label>
                    </div>
                </div>

                <div id="guardian-fields" class="hidden">
                    <div
                        style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; background: #fefce8; padding: 1rem; border-radius: 8px;">
                        <div class="form-group">
                            <label>Nombre del Encargado</label>
                            <input type="text" id="app-guardian-name" placeholder="Nombre completo">
                        </div>
                        <div class="form-group">
                            <label>DNI del Encargado</label>
                            <input type="text" id="app-guardian-dni" placeholder="Identificación">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>¿Por qué necesitas esta beca?</label>
                    <textarea id="app-reason" rows="4" required
                        placeholder="Escribe aquí tu justificación..."></textarea>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="Applicant.closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/applicant.js"></script>
</body>

</html>
