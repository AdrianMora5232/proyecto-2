<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Gestión de Becas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
      <link rel="stylesheet" href="../css/estilo.css">

    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-md);
            width: 90%;
            max-width: 500px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
    </style>
</head>

<body class="dashboard-layout">

    <nav class="navbar">
        <div class="container nav-content">
            <a href="#" class="nav-logo">MiPortal</a>
            <div class="nav-links">
                <span>Postulante</span>
                <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <!-- Available Scholarships -->
        <h2 style="margin-bottom: 1.5rem;">Becas Disponibles</h2>
        <div id="scholarships-grid" class="grid-container" style="margin-bottom: 3rem;">
            <!-- Dynamic Cards -->
        </div>

        <!-- History -->
        <h2 style="margin-bottom: 1.5rem;">Mis Postulaciones</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Beca</th>
                        <th>Fecha Postulación</th>
                        <th>Estado</th>
                        <th>Notas del Evaluador</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <!-- Dynamic Content -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Application Modal -->
    <div id="app-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 700px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="modal-title">Postular a Beca</h2>
                <button onclick="Applicant.closeModal()"
                    style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>

            <form id="applicationForm">
                <input type="hidden" id="app-s-id">

                <h3
                    style="font-size: 1.1rem; color: var(--primary); margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                    1. Datos Personales</h3>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="app-name" readonly style="background-color: #f0f2f5;">
                    </div>
                    <div class="form-group">
                        <label>Correo Electrónico</label>
                        <input type="email" id="app-email" readonly style="background-color: #f0f2f5;">
                    </div>
                    <div class="form-group">
                        <label>DNI / Identificación</label>
                        <input type="text" id="app-dni" readonly style="background-color: #f0f2f5;">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="app-phone" readonly style="background-color: #f0f2f5;">
                    </div>
                    <div class="form-group">
                        <label>Fecha de Nacimiento <span style="color:var(--danger)">*</span></label>
                        <input type="date" id="app-dob" required>
                    </div>
                </div>

                <h3
                    style="font-size: 1.1rem; color: var(--primary); margin: 1.5rem 0 1rem 0; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                    2. Información Socioeconómica y Académica</h3>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Nivel Educativo Actual <span style="color:var(--danger)">*</span></label>
                        <select id="app-education" required>
                            <option value="">Seleccione...</option>
                            <option value="secundaria">Secundaria</option>
                            <option value="preparatoria">Preparatoria / Bachillerato</option>
                            <option value="universidad">Universidad (Pregrado)</option>
                            <option value="posgrado">Posgrado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ingresos Mensuales Familiares ($) <span style="color:var(--danger)">*</span></label>
                        <input type="number" id="app-income" placeholder="0.00" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Motivo de la Solicitud <span style="color:var(--danger)">*</span></label>
                    <textarea id="app-reason" rows="3" placeholder="Explique brevemente por qué solicita esta beca..."
                        required></textarea>
                </div>

                <div class="form-group">
                    <label>Comentarios Adicionales / Enlaces a Documentos</label>
                    <textarea id="app-notes" rows="2"
                        placeholder="Ej: Link a Google Drive con boleta de calificaciones..."></textarea>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-secondary" onclick="Applicant.closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/applicant.js"></script>
</body>

</html>
