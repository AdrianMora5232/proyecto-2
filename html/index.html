<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión de Becas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilo.css">
</head>

<body class="auth-layout">

    <div class="auth-container">
        <div class="auth-header">
            <h1>Bienvenido</h1>
            <p>Sistema de Gestión de Becas y Ayudas</p>
        </div>

        <div class="card glass-card">
            <form id="loginForm">
                <div class="form-group">
                    <label for="role">Tipo de Usuario</label>
                    <select id="role" required>
                        <option value="applicant">Postulante</option>
                        <option value="evaluator">Evaluador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>

                <div id="extra-fields" class="hidden">
                    <div class="form-group">
                        <label for="workerId">Número de Trabajador</label>
                        <input type="text" id="workerId" placeholder="W-1234">
                    </div>
                    <div class="form-group">
                        <label for="dni">Número de Identificación (DNI)</label>
                        <input type="text" id="dni" placeholder="12345678">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%">Iniciar Sesión</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                <p>¿No tienes cuenta? <a href="register.html"
                        style="color: var(--primary); font-weight: 600;">Regístrate</a></p>
            </div>

            <div id="message" class="hidden"
                style="margin-top: 1rem; padding: 0.5rem; border-radius: 4px; text-align: center;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Define NO_AUTH_CHECK to prevent immediate redirect loop if logic fails -->
    <script>const NO_AUTH_CHECK = true;</script>
    <script src="../js/storage.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already logged in
            const user = Storage.getCurrentUser();
            if (user) Auth.redirectUser(user);

            const form = document.getElementById('loginForm');
            const msg = document.getElementById('message');

            const toggleFields = () => {
                const role = document.getElementById('role').value;
                const extraFields = document.getElementById('extra-fields');
                const workInput = document.getElementById('workerId');
                const dniInput = document.getElementById('dni');

                if (role === 'admin' || role === 'evaluator') {
                    extraFields.classList.remove('hidden');
                    workInput.required = true;
                    dniInput.required = true;
                } else {
                    extraFields.classList.add('hidden');
                    workInput.required = false;
                    dniInput.required = false;
                }
            };

            document.getElementById('role').addEventListener('change', toggleFields);
            toggleFields(); // Init state

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;

                // Extra fields
                const workerId = document.getElementById('workerId').value;
                const dni = document.getElementById('dni').value;

                const result = Auth.login({ email, password, role, workerId, dni });

                if (result.success) {
                    msg.className = 'badge-approved'; // Reuse success style
                    msg.textContent = 'Ingreso exitoso. Redirigiendo...';
                    msg.classList.remove('hidden');
                    setTimeout(() => Auth.redirectUser(result.user), 1000);
                } else {
                    msg.className = 'badge-rejected'; // Reuse error style
                    msg.textContent = result.message;
                    msg.classList.remove('hidden');
                }
            });
        });
    </script>
</body>

</html>
