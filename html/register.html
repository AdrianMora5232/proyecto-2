<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestión de Becas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-layout">

    <div class="auth-container">
        <div class="auth-header">
            <h1>Crear Cuenta</h1>
            <p>Regístrate para postular a becas</p>
        </div>

        <div class="card glass-card">
            <form id="registerForm">
                <div class="form-group">
                    <label for="reg-role">Registrarse como</label>
                    <select id="reg-role" required>
                        <option value="applicant">Postulante</option>
                        <option value="evaluator">Evaluador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" required placeholder="Juan Perez">
                </div>

                <div class="form-group">
                    <label for="dni">DNI / Identificación</label>
                    <input type="text" id="dni" required placeholder="12345678">
                </div>

                <div id="worker-field" class="form-group hidden">
                    <label for="workerId">Número de Trabajador</label>
                    <input type="text" id="workerId" placeholder="W-xxx">
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" required placeholder="555-0000">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%">Registrarse</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                <p>¿Ya tienes cuenta? <a href="index.html" style="color: var(--primary); font-weight: 600;">Inicia
                        Sesión</a></p>
            </div>

            <div id="message" class="hidden"
                style="margin-top: 1rem; padding: 0.5rem; border-radius: 4px; text-align: center;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script>const NO_AUTH_CHECK = true;</script>
    <script src="../js/storage.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already logged in
            const user = Storage.getCurrentUser();
            if (user) Auth.redirectUser(user);

            const form = document.getElementById('registerForm');
            const msg = document.getElementById('message');

            // Toggle Worker Field
            document.getElementById('reg-role').addEventListener('change', (e) => {
                const role = e.target.value;
                const field = document.getElementById('worker-field');
                const output = document.getElementById('workerId');

                if (role === 'admin' || role === 'evaluator') {
                    field.classList.remove('hidden');
                    output.required = true;
                } else {
                    field.classList.add('hidden');
                    output.required = false;
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const dni = document.getElementById('dni').value;
                const phone = document.getElementById('phone').value;
                const role = document.getElementById('reg-role').value;
                const workerId = document.getElementById('workerId').value;

                const result = Auth.register(name, email, password, dni, phone, role, workerId);

                if (result.success) {
                    msg.className = 'badge-approved';
                    msg.textContent = 'Registro exitoso. Redirigiendo al login...';
                    msg.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    msg.className = 'badge-rejected';
                    msg.textContent = result.message;
                    msg.classList.remove('hidden');
                }
            });
        });
    </script>
</body>

</html>
