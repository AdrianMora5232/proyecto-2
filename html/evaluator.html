<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación - Gestión de Becas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">

    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-md);
            width: 90%;
            max-width: 600px;
        }

        .data-label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .data-value {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }
    </style>
</head>

<body class="dashboard-layout">

    <nav class="navbar">
        <div class="container nav-content">
            <a href="#" class="nav-logo">EvaluatorPanel</a>
            <div class="nav-links">
                <span>Evaluador</span>
                <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <h2 style="margin-bottom: 1.5rem;">Solicitudes Pendientes</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Postulante</th>
                        <th>Beca</th>
                        <th>Fecha</th>
                        <th>Notas</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="reviews-table-body">
                    <!-- Dynamic Content -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Review Modal -->
    <div id="review-modal" class="modal hidden">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Evaluar Solicitud</h2>

            <div style="background: #f8fafc; padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
                <div class="data-label">POSTULANTE</div>
                <div class="data-value" id="applicant-name"></div>

                <div class="data-label">DETALLES</div>
                <div class="data-value" id="applicant-details"></div>

                <div class="data-label">SOLICITA BECA</div>
                <div class="data-value" id="scholarship-name"></div>

                <div class="data-label">NOTAS DEL POSTULANTE</div>
                <div class="data-value" id="applicant-notes"></div>
            </div>

            <form id="evaluationForm">
                <input type="hidden" id="review-app-id">

                <div class="form-group">
                    <label>Comentarios de Evaluación</label>
                    <textarea id="review-notes" rows="4" required placeholder="Justifique la decisión..."></textarea>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: space-between;">
                    <button type="button" class="btn btn-secondary" onclick="Evaluator.closeModal()">Cancelar</button>
                    <div style="display: flex; gap: 0.5rem;">
                        <button type="button" class="btn btn-danger"
                            onclick="Evaluator.submitEvaluation('rejected')">Rechazar</button>
                        <button type="button" class="btn btn-primary" style="background: var(--success);"
                            onclick="Evaluator.submitEvaluation('approved')">Aprobar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/evaluator.js"></script>
</body>

</html>
